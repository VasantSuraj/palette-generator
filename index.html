<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palette Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Palette Generator</h1>
    <p>Press <kbd>Space</kbd> or click the button for new colors. Click a color to copy it. Click the lock to keep it.</p>
  </header>

  <main id="palette"></main>

  <footer>
    <button id="generate">Generate palette</button>
    <span id="toast" aria-live="polite"></span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
